name: Build O'ZBEK AI 10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Repositoryni yuklash
        uses: actions/checkout@v4

      - name: Python o‘rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android build muhitini tayyorlash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk

          pip install --upgrade pip
          pip install buildozer
          pip install cython

      - name: APK yaratish
        run: |
          buildozer android debug

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ozbekai-10-apk
          path: bin/*.apk
